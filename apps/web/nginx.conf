server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Docker's embedded DNS. Required so the upstream below is re-resolved at
  # request time instead of being cached forever at nginx start-up — otherwise
  # recreating the api container (which gives it a new IP) 502s every API call
  # until nginx is restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Reverse-proxy API calls to the api service on the internal network.
  # No public exposure in Phase 1: the whole stack sits behind the platform's
  # private network / VPN (see ENVIRONMENTS.md).
  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Basic hardening headers (defence in depth alongside the API's own headers)
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN;
}
