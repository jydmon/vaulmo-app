name: Mobile (EAS)

# Build and submit the native iOS/Android apps with EAS.
# Requires an Expo account + EXPO_TOKEN secret. Store store credentials as EAS secrets,
# not in the repo. Triggered manually (choose a profile) or on a version tag.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: 'Platform to build'
        type: choice
        options: [android, ios, all]
        default: android
      submit:
        description: 'Submit to stores after build (production only)'
        type: boolean
        default: false
  push:
    tags: ['mobile-v*']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Check EXPO_TOKEN secret is present
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::EXPO_TOKEN repository secret is empty or not set."
            echo "Add it at Settings > Secrets and variables > Actions > New repository secret."
            exit 1
          fi
          echo "EXPO_TOKEN is present (${#EXPO_TOKEN} characters)."
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm install
      - name: EAS build
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas build --non-interactive --platform ${{ github.event.inputs.platform || 'android' }} --profile ${{ github.event.inputs.profile || 'preview' }}
      - name: EAS submit (stores)
        if: ${{ github.event.inputs.submit == 'true' && github.event.inputs.profile == 'production' }}
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas submit --non-interactive --platform ${{ github.event.inputs.platform }} --profile production
