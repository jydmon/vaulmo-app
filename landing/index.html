<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vaulmo — Your family's document vault, locked down</title>
<meta name="description" content="Vaulmo keeps your family's most important documents secure, organised, and always to hand. Bank-level encryption, smart scanning, and renewal reminders." />
<style>
  :root{
    --navy:#0F172A; --navy2:#111c33; --blue:#2563EB; --blue-d:#1E3A8A;
    --aqua:#22D3EE; --ink:#0F172A; --muted:#5b6b85; --line:#e6ebf3; --bg:#f6f8fc; --card:#ffffff;
    --radius:18px; --shadow:0 18px 50px rgba(15,23,42,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px}

  /* nav */
  nav{position:sticky;top:0;z-index:50;background:rgba(246,248,252,.82);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.5px}
  .brand svg{display:block}
  .nav-links{display:flex;align-items:center;gap:22px}
  .nav-links a{color:var(--muted);font-weight:600;font-size:15px}
  .nav-links a:hover{color:var(--ink)}
  .nav-links a.active{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;font-weight:700;padding:11px 18px;border-radius:12px;font-size:15px;transition:transform .15s ease, box-shadow .15s;border:0;cursor:pointer}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(37,99,235,.35)}
  /* FIX: the Download button text must stay white — .nav-links a would otherwise
     out-specify .btn and turn it grey. */
  .nav-links a.btn, .nav-links a.btn:hover{color:#fff}
  @media(max-width:860px){.nav-links a:not(.btn){display:none}}

  /* hero */
  .hero{background:radial-gradient(1200px 500px at 80% -10%, #24407e 0%, transparent 60%), linear-gradient(160deg,#0F172A 0%, #16233f 60%, #1E3A8A 140%);color:#fff;overflow:hidden}
  .hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:78px 0 90px}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#cfe0ff;font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px;margin-bottom:22px}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--aqua);box-shadow:0 0 10px var(--aqua)}
  h1{font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-1.5px;font-weight:850;margin-bottom:18px}
  h1 .grad{background:linear-gradient(90deg,#7cc7ff,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{font-size:19px;color:#c4d1ea;max-width:520px;margin-bottom:30px}
  .stores{display:flex;gap:14px;flex-wrap:wrap}
  .store{display:inline-flex;align-items:center;gap:11px;background:#000;color:#fff;border:1px solid #2c3550;padding:11px 18px;border-radius:14px;transition:transform .15s, border-color .15s}
  .store:hover{transform:translateY(-2px);border-color:#4b5875}
  .store small{display:block;font-size:11px;opacity:.8;line-height:1.1;letter-spacing:.3px}
  .store strong{display:block;font-size:19px;line-height:1.15;font-weight:700;margin-top:1px}
  .store svg{flex:none}
  .hero-note{margin-top:16px;font-size:13px;color:#8ea3c8}

  /* phone */
  .phone-col{display:flex;justify-content:center}
  .phone{width:290px;height:590px;background:#0b1220;border-radius:44px;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.5), inset 0 0 0 2px #2a3350;position:relative}
  .phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#0b1220;border-radius:0 0 16px 16px;z-index:3}
  .screen{width:100%;height:100%;background:linear-gradient(180deg,#eef3fb,#ffffff);border-radius:34px;overflow:hidden;position:relative;color:var(--ink)}
  .s-top{background:linear-gradient(160deg,#2563EB,#1E3A8A);color:#fff;padding:34px 20px 22px}
  .s-top .stitle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
  .s-hero{margin-top:16px}
  .s-hero .lab{font-size:12px;color:#cfe0ff}
  .s-hero .big{font-size:30px;font-weight:850;letter-spacing:-1px}
  .s-hero .sub{font-size:12px;color:#cfe0ff;margin-top:2px}
  .s-body{padding:16px}
  .doc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
  .doc .ic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
  .doc .m{flex:1;min-width:0}
  .doc .t{font-size:13px;font-weight:700}
  .doc .d{font-size:11px;color:var(--muted)}
  .chip{font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px}
  .s-tabs{position:absolute;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 6px}
  .s-tabs span{width:22px;height:22px;border-radius:6px;background:#dfe7f4}
  .s-tabs span.act{background:var(--blue)}

  /* sections */
  section{padding:82px 0}
  .eyebrow{color:var(--blue);font-weight:800;letter-spacing:.6px;text-transform:uppercase;font-size:13px;text-align:center}
  h2{font-size:clamp(28px,4vw,40px);letter-spacing:-1px;font-weight:850;text-align:center;margin:10px 0 12px}
  .sub2{color:var(--muted);text-align:center;max-width:620px;margin:0 auto 46px;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;box-shadow:var(--shadow)}
  .card .fic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:#e7efff}
  .card h3{font-size:17px;margin-bottom:7px;letter-spacing:-.3px}
  .card p{color:var(--muted);font-size:14.5px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}

  /* security band */
  .band{background:linear-gradient(160deg,#0F172A,#1E3A8A);color:#fff;border-radius:26px;padding:56px 44px;display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center}
  .band h2{text-align:left;margin-top:0}
  .band .sub2{text-align:left;margin:0 0 22px;color:#c4d1ea}
  .band ul{list-style:none;display:grid;gap:12px}
  .band li{display:flex;gap:11px;align-items:flex-start;color:#dbe6fb;font-size:15px}
  .band li svg{flex:none;margin-top:2px}
  @media(max-width:820px){.band{grid-template-columns:1fr;padding:40px 26px}.hero-in{grid-template-columns:1fr;padding:56px 0 64px}.phone-col{order:-1;margin-bottom:10px}}

  /* content sub-pages */
  .page{padding:64px 0 40px}
  .page .lede{max-width:760px;margin:0 auto}
  .page h1.ph{font-size:clamp(30px,4.4vw,44px);text-align:center;letter-spacing:-1px;margin-bottom:12px}
  .page .pintro{color:var(--muted);text-align:center;font-size:18px;max-width:680px;margin:0 auto 10px}
  .page .updated{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .blocks{max-width:820px;margin:34px auto 0;display:grid;gap:16px}
  .block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
  .block h3{font-size:18px;margin-bottom:6px;letter-spacing:-.3px}
  .block p{color:var(--muted);font-size:15.5px}
  .checklist{max-width:820px;margin:26px auto 0;display:grid;gap:12px;list-style:none}
  .checklist li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:15.5px}
  .checklist li svg{flex:none;margin-top:3px}
  .contact-grid{max-width:820px;margin:30px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.contact-grid{grid-template-columns:1fr}}
  .faq-list{max-width:820px;margin:30px auto 0;display:grid;gap:12px}
  details.faq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 20px;box-shadow:var(--shadow)}
  details.faq summary{cursor:pointer;font-weight:700;font-size:16px;padding:16px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.faq summary::-webkit-details-marker{display:none}
  details.faq summary::after{content:'+';color:var(--blue);font-weight:800;font-size:22px}
  details.faq[open] summary::after{content:'–'}
  details.faq p{color:var(--muted);font-size:15.5px;padding:0 0 18px}
  .backhome{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;margin:8px 0 0}

  /* subscribe form */
  .subwrap{max-width:560px;margin:24px auto 0}
  .sub-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);text-align:left}
  .sub-card.dark{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);box-shadow:none}
  .sub-card .sh{font-weight:800;font-size:18px;letter-spacing:-.3px;margin-bottom:3px}
  .sub-card.dark .sh{color:#fff}
  .sub-card .ss{color:var(--muted);font-size:14px;margin-bottom:14px}
  .sub-card.dark .ss{color:#c4d1ea}
  .sub-row{display:flex;gap:10px;flex-wrap:wrap}
  .subform input{flex:1;min-width:170px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
  .subform .check{display:flex;align-items:center;gap:9px;margin:12px 2px;font-size:14px;color:var(--muted);cursor:pointer}
  .sub-card.dark .subform .check{color:#cfe0ff}
  .subform button{margin-top:6px;width:100%;justify-content:center;border:0;cursor:pointer}
  .sub-ok{color:#0f9d58;font-weight:700;text-align:center;padding:10px}
  .sub-card.dark .sub-ok{color:#7ef0b0}
  .sub-err{color:#d03b3b;font-weight:600;font-size:13.5px;margin-top:8px}

  /* socials */
  .socials{display:flex;gap:12px}
  .socials a{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s}
  .socials a:hover{color:#fff;background:var(--blue);border-color:var(--blue)}

  /* launch popup */
  .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-back.open{display:flex}
  .modal{background:#fff;border-radius:20px;max-width:470px;width:100%;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative}
  .modal h3{font-size:23px;letter-spacing:-.5px;margin-bottom:8px}
  .modal p{color:var(--muted);margin-bottom:18px}
  .modal .x{position:absolute;top:12px;right:16px;font-size:24px;color:var(--muted);cursor:pointer;background:none;border:0;line-height:1}

  /* cta + footer */
  .cta{text-align:center}
  .cta .stores{justify-content:center}
  footer{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:14px}
  .foot-in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .foot-links{display:flex;gap:20px;flex-wrap:wrap}
  .foot-links a:hover{color:var(--ink)}
</style>
</head>
<body>

<nav>
  <div class="wrap nav-in">
    <a class="brand" href="#/" aria-label="Vaulmo home">
      <svg width="34" height="34" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="ng" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3B82F6"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#ng)"/><path d="M256 120c44 0 80 12 116 30v112c0 74-46 126-116 152-70-26-116-78-116-152V150c36-18 72-30 116-30Z" fill="#fff"/><path d="M196 196l60 126 60-126" fill="none" stroke="#2563EB" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="300" r="19" fill="#22D3EE"/></svg>
      Vaulmo
    </a>
    <div class="nav-links" id="navLinks"></div>
  </div>
</nav>

<main id="app"></main>

<footer>
  <div class="wrap foot-in">
    <div class="brand" style="font-size:18px">
      <svg width="26" height="26" viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="fg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3B82F6"/><stop offset=".55" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient></defs><rect width="512" height="512" rx="116" fill="url(#fg)"/><path d="M256 120c44 0 80 12 116 30v112c0 74-46 126-116 152-70-26-116-78-116-152V150c36-18 72-30 116-30Z" fill="#fff"/><path d="M196 196l60 126 60-126" fill="none" stroke="#2563EB" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/><circle cx="256" cy="300" r="19" fill="#22D3EE"/></svg>
      Vaulmo
    </div>
    <div class="foot-links" id="footLinks"></div>
    <div class="socials" id="footSocials"></div>
    <div id="footNote">© 2026 Vaulmo. All rights reserved.</div>
  </div>
</footer>

<!-- launch popup: shown when Download / store buttons are tapped before launch -->
<div class="modal-back" id="popup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
  <div class="modal">
    <button class="x" id="popupClose" aria-label="Close">×</button>
    <h3 id="popupTitle">Vaulmo isn’t live just yet</h3>
    <p id="popupBody"></p>
    <div id="popupForm"></div>
  </div>
</div>

<script>
/* ============================================================================
   CMS-driven marketing site. Content is fetched from the Vaulmo API (editable in
   the admin console). If the API is unreachable, the built-in DEFAULTS below render
   instead, so the site always works. Every page is addressed by hash (#/features …).
   ========================================================================== */
var API = (window.VAULMO_API || 'https://app.vaulmo.com') + '/api/v1';

/* Built-in fallback copy (mirrors the API seed). */
var DEFAULTS = {
  global: {
    brand:'Vaulmo',
    appStoreUrl:'#', googlePlayUrl:'#',
    nav:[{label:'Features',href:'#/features'},{label:'Security',href:'#/security'},{label:'Privacy',href:'#/privacy'},{label:'Support',href:'#/support'},{label:'About',href:'#/about'},{label:'FAQs',href:'#/faq'},{label:'Contact',href:'#/contact'}],
    footerNote:'© 2026 Vaulmo. All rights reserved.',
    footerLinks:[{label:'Features',href:'#/features'},{label:'Security',href:'#/security'},{label:'Privacy',href:'#/privacy'},{label:'Support',href:'#/support'},{label:'About',href:'#/about'},{label:'Contact',href:'#/contact'}],
    socials:{instagram:'',twitter:'',facebook:''},
    subscribe:{title:'Be first to know',subtitle:'Join the waitlist and we’ll tell you the moment Vaulmo launches.',namePlaceholder:'Your name',emailPlaceholder:'you@example.com',notifyLabel:'Notify me when you launch',button:'Join the waitlist',success:'You’re on the list — thank you! We’ll be in touch at launch.'},
    popup:{title:'Vaulmo isn’t live just yet',body:'We’re putting the finishing touches to the app. Leave your details and we’ll email you the moment it’s ready to download.'}
  },
  home:{
    heroPill:'Bank-level encryption · Family-ready',
    heroTitle:'Your family’s important documents,', heroTitleAccent:'locked down.',
    heroLead:'Vaulmo keeps passports, policies, warranties and wills secure, organised and always to hand — with smart scanning and reminders so nothing important ever slips.',
    heroNote:'Coming soon to iOS & Android. Free to download.',
    featuresEyebrow:'Everything in one place', featuresTitle:'Built to keep life’s paperwork safe',
    featuresIntro:'Snap a photo and Vaulmo reads the details, files it, and reminds you before anything expires.',
    features:[{title:'Bank-level security',body:'Documents are encrypted, protected by two-factor login, and only ever visible to you and the people you choose.'},{title:'Smart scanning',body:'Photograph a document and Vaulmo pulls out the key dates and details automatically — no typing.'},{title:'Never miss a renewal',body:'Passports, insurance, warranties, MOTs — get reminded in good time, only after you confirm the dates.'},{title:'Family & next of kin',body:'Share the right documents with your household, and nominate a trusted next of kin for emergencies.'}],
    ctaEyebrow:'Get started', ctaTitle:'Bring your paperwork into one secure place', ctaIntro:'Download Vaulmo and set up your family vault in minutes.'
  },
  features:{title:'Everything Vaulmo does for you',intro:'One secure home for the documents, dates and details your family relies on.',sections:[{heading:'Scan & organise',body:'Photograph or upload any document and Vaulmo reads the key details, files it, and makes it searchable in seconds.'},{heading:'Renewals & reminders',body:'Vaulmo tracks expiry and renewal dates and reminds you in good time — in one clear “what’s coming up” view.'},{heading:'Ask Vaulmo',body:'Ask plain-English questions and get answers drawn only from your own vault.'},{heading:'Family & emergency access',body:'Nominate a trusted next of kin who can request access in an emergency — always with your approval.'}]},
  security:{title:'Security you can trust',intro:'Vaulmo is built security-first, because it holds the documents that matter most.',points:['Encryption at rest for your most sensitive data','Two-factor authentication and device management','Biometric app lock on mobile','You decide who sees what — nothing is shared by default','A full activity log of every action'],sections:[]},
  privacy:{title:'Privacy policy',updated:'Last updated: August 2026',intro:'Your documents are yours. This summary explains what we collect and the control you have.',sections:[{heading:'What we store',body:'The documents and details you add, plus the account information needed to run the service. We do not sell your data.'},{heading:'Who can see it',body:'Only you, and the people you explicitly grant access to.'},{heading:'Your rights',body:'Export or delete your data at any time from within the app.'}]},
  support:{title:'Help & support',intro:'We’re here to help you get the most out of Vaulmo.',channels:[{name:'Email support',detail:'support@vaulmo.com'},{name:'In-app help',detail:'Open the app and visit Help & FAQ.'}],note:''},
  about:{title:'About Vaulmo',intro:'A secure digital vault for your family’s most important documents.',sections:[{heading:'Why we built it',body:'Life’s paperwork is scattered and easy to lose. Vaulmo brings it into one secure place.'}]},
  contact:{title:'Contact us',intro:'We’d love to hear from you.',email:'hello@vaulmo.com',supportEmail:'support@vaulmo.com',phone:'',address:'',hours:'Monday to Friday, 9am–5pm'},
  faq:{title:'Frequently asked questions',intro:'The short answers to the questions we hear most.',items:[{q:'Is my data secure?',a:'Yes — encrypted, protected by two-factor authentication and an optional biometric lock.'},{q:'What does it cost?',a:'Vaulmo is free to download; plans unlock more features.'}]}
};

var CONTENT = JSON.parse(JSON.stringify(DEFAULTS));

/* Escape user/CMS-provided text before inserting into HTML. */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function page(slug){ return CONTENT[slug] || DEFAULTS[slug] || {}; }
var CHECK='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#22D3EE" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>';
var CHECKB='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.4"><path d="M20 6L9 17l-5-5"/></svg>';

/* Whether the app is actually released (real store links set). Pre-launch, the store
   buttons and Download open the waitlist popup instead of going nowhere. */
function launched(){ var g=page('global'); var a=(g.appStoreUrl||'#'), p=(g.googlePlayUrl||'#'); return (a && a!=='#') || (p && p!=='#'); }
function stores(){
  var g=page('global');
  return '<div class="stores">'
    + '<a class="store" data-download href="'+esc(g.appStoreUrl||'#')+'" aria-label="Download on the App Store"><svg width="26" height="26" viewBox="0 0 384 512" fill="#fff"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zM255.9 90.7c17.3-20.5 26.4-45.7 24.2-71.3-22.9 1-49.4 15.4-64.9 33.9-14.4 17.2-24.9 42.3-22.3 65.6 25.6 2 49.4-12.7 63-28.2z"/></svg><span><small>Download on the</small><strong>App Store</strong></span></a>'
    + '<a class="store" data-download href="'+esc(g.googlePlayUrl||'#')+'" aria-label="Get it on Google Play"><svg width="24" height="26" viewBox="0 0 512 512"><path d="M48 59.5v393a12 12 0 0 0 18.4 10.2l238-206.2z" fill="#22D3EE"/><path d="M304.4 256.5 66.4 462.7A12 12 0 0 0 82 463l289-166.9z" fill="#34D399"/><path d="M436.5 222.9 371 185.1l-66.6 71.4L371 327.9l65.5-37.8a20 20 0 0 0 0-67.2z" fill="#FBBF24"/><path d="M82 49 304.4 256.5 371 185.1 82 49z" fill="#60A5FA"/></svg><span><small>GET IT ON</small><strong>Google Play</strong></span></a>'
    + '</div>';
}

/* The waitlist form — identical markup wherever it appears (top, bottom, popup). */
function subForm(dark){
  var s=(page('global').subscribe)||{};
  return '<div class="sub-card'+(dark?' dark':'')+'">'
    + '<div class="sh">'+esc(s.title||'Be first to know')+'</div>'
    + '<div class="ss">'+esc(s.subtitle||'')+'</div>'
    + '<form class="subform" data-sub novalidate>'
    +   '<div class="sub-row"><input type="text" name="name" required placeholder="'+esc(s.namePlaceholder||'Your name')+'" autocomplete="name"><input type="email" name="email" required placeholder="'+esc(s.emailPlaceholder||'you@example.com')+'" autocomplete="email"></div>'
    +   '<label class="check"><input type="checkbox" name="notify" checked> '+esc(s.notifyLabel||'Notify me when you launch')+'</label>'
    +   '<button class="btn" type="submit">'+esc(s.button||'Join the waitlist')+'</button>'
    +   '<div class="sub-err" hidden></div>'
    + '</form></div>';
}
function socialIcons(){
  var s=(page('global').socials)||{};
  var ic={ instagram:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>',
    twitter:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M18.24 2H21l-6.5 7.43L22 22h-6.28l-4.9-6.4L5.2 22H2.4l6.95-7.94L2 2h6.44l4.43 5.86L18.24 2Zm-2.2 18h1.55L7.03 3.94H5.36L16.04 20Z"/></svg>',
    facebook:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 10-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0022 12Z"/></svg>' };
  var out='';
  ['instagram','twitter','facebook'].forEach(function(k){ if(s[k]){ out+='<a href="'+esc(s[k])+'" target="_blank" rel="noopener" aria-label="'+k+'">'+ic[k]+'</a>'; } });
  return out;
}

function renderChrome(){
  var g=page('global');
  var links=(g.nav||[]).map(function(n){return '<a href="'+esc(n.href)+'">'+esc(n.label)+'</a>';}).join('');
  document.getElementById('navLinks').innerHTML = links + '<a class="btn" data-download href="#/download">Download</a>';
  document.getElementById('footLinks').innerHTML = (g.footerLinks||[]).map(function(n){return '<a href="'+esc(n.href)+'">'+esc(n.label)+'</a>';}).join('');
  document.getElementById('footSocials').innerHTML = socialIcons();
  document.getElementById('footNote').textContent = g.footerNote || '';
  var pop=g.popup||{};
  document.getElementById('popupTitle').textContent = pop.title || 'Vaulmo isn’t live just yet';
  document.getElementById('popupBody').textContent = pop.body || '';
  document.getElementById('popupForm').innerHTML = subForm(false);
}

/* ---- waitlist submit + launch popup ---- */
function submitSub(form){
  var err=form.querySelector('.sub-err'); err.hidden=true;
  var name=(form.name.value||'').trim(), email=(form.email.value||'').trim(), notify=form.notify.checked;
  if(!name||!email){ err.textContent='Please enter your name and email.'; err.hidden=false; return; }
  var btn=form.querySelector('button'); btn.disabled=true; btn.textContent='Joining…';
  fetch(API+'/site/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name,email:email,notifyAtLaunch:notify,source:'website'})})
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(){ var card=form.closest('.sub-card'); var s=(page('global').subscribe)||{}; card.innerHTML='<div class="sub-ok">✓ '+esc(s.success||'You’re on the list — thank you!')+'</div>'; })
    .catch(function(){ btn.disabled=false; btn.textContent=(page('global').subscribe||{}).button||'Join the waitlist'; err.textContent='Something went wrong — please try again.'; err.hidden=false; });
}
function openPopup(){ document.getElementById('popup').classList.add('open'); }
function closePopup(){ document.getElementById('popup').classList.remove('open'); }

document.addEventListener('submit', function(e){ var f=e.target; if(f&&f.matches&&f.matches('form[data-sub]')){ e.preventDefault(); submitSub(f); } });
document.addEventListener('click', function(e){
  var dl=e.target.closest && e.target.closest('[data-download]');
  if(dl && !launched()){ e.preventDefault(); openPopup(); return; }
  if(e.target.id==='popupClose' || e.target.id==='popup'){ closePopup(); }
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') closePopup(); });

/* ---- page renderers ---- */
function viewHome(){
  var h=page('home');
  var cards=(h.features||[]).map(function(f){return '<div class="card"><div class="fic">'+CHECKB+'</div><h3>'+esc(f.title)+'</h3><p>'+esc(f.body)+'</p></div>';}).join('');
  var secPoints=(page('security').points||[]).slice(0,4).map(function(p){return '<li>'+CHECK+' '+esc(p)+'</li>';}).join('');
  return ''
  + '<header class="hero"><div class="wrap hero-in"><div>'
  +   '<span class="pill"><span class="dot"></span> '+esc(h.heroPill)+'</span>'
  +   '<h1>'+esc(h.heroTitle)+' <span class="grad">'+esc(h.heroTitleAccent)+'</span></h1>'
  +   '<p class="lead">'+esc(h.heroLead)+'</p>'
  +   stores()
  +   '<p class="hero-note">'+esc(h.heroNote)+'</p>'
  +   '<div class="subwrap" style="margin-left:0">'+subForm(true)+'</div>'
  + '</div><div class="phone-col"><div class="phone"><div class="notch"></div><div class="screen">'
  +   '<div class="s-top"><div class="stitle">Vaulmo</div><div class="s-hero"><div class="lab">Your vault</div><div class="big">82% complete</div><div class="sub">3 recommended documents to add</div></div></div>'
  +   '<div class="s-body">'
  +     '<div class="doc"><div class="ic" style="background:#e7efff">🛂</div><div class="m"><div class="t">Passport</div><div class="d">Expires 12 Mar 2029</div></div><span class="chip" style="background:#e7f8ee;color:#0f9d58">Verified</span></div>'
  +     '<div class="doc"><div class="ic" style="background:#eafaf1">🏠</div><div class="m"><div class="t">Home insurance</div><div class="d">Renews 01 Sep 2026</div></div><span class="chip" style="background:#fff3e0;color:#e08600">Soon</span></div>'
  +     '<div class="doc"><div class="ic" style="background:#f0ecff">📺</div><div class="m"><div class="t">TV warranty</div><div class="d">Expires 03 Aug 2028</div></div><span class="chip" style="background:#eef2f8;color:#5b6b85">Saved</span></div>'
  +   '</div><div class="s-tabs"><span class="act"></span><span></span><span></span><span></span><span></span></div>'
  + '</div></div></div></div></header>'
  + '<section id="features"><div class="wrap"><div class="eyebrow">'+esc(h.featuresEyebrow)+'</div><h2>'+esc(h.featuresTitle)+'</h2><p class="sub2">'+esc(h.featuresIntro)+'</p><div class="grid">'+cards+'</div></div></section>'
  + '<section id="security" style="padding-top:0"><div class="wrap"><div class="band"><div><h2>'+esc(page('security').title)+'</h2><p class="sub2">'+esc(page('security').intro)+'</p><a class="btn" data-download href="#/download">Get the app</a></div><ul>'+secPoints+'</ul></div></div></section>'
  + '<section class="cta" style="padding-top:0"><div class="wrap"><div class="eyebrow">'+esc(h.ctaEyebrow)+'</div><h2>'+esc(h.ctaTitle)+'</h2><p class="sub2">'+esc(h.ctaIntro)+'</p>'+stores()+'<div class="subwrap">'+subForm(false)+'</div></div></section>';
}
function blocks(sections){ return '<div class="blocks">'+(sections||[]).map(function(s){return '<div class="block"><h3>'+esc(s.heading)+'</h3><p>'+esc(s.body)+'</p></div>';}).join('')+'</div>'; }
function pageShell(inner){ return '<section class="page"><div class="wrap">'+inner+'<div style="text-align:center"><a class="backhome" href="#/">← Back to home</a></div></div></section>'; }

function viewSimple(slug){ var p=page(slug); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1>'+(p.updated?'<div class="updated">'+esc(p.updated)+'</div>':'')+'<p class="pintro">'+esc(p.intro)+'</p>'+blocks(p.sections)); }
function viewSecurity(){ var p=page('security'); var pts=(p.points||[]).map(function(x){return '<li>'+CHECKB+' '+esc(x)+'</li>';}).join(''); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1><p class="pintro">'+esc(p.intro)+'</p><ul class="checklist">'+pts+'</ul>'+blocks(p.sections)); }
function viewSupport(){ var p=page('support'); var ch=(p.channels||[]).map(function(c){return '<div class="block"><h3>'+esc(c.name)+'</h3><p>'+esc(c.detail)+'</p></div>';}).join(''); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1><p class="pintro">'+esc(p.intro)+'</p><div class="blocks">'+ch+'</div>'+(p.note?'<p class="pintro" style="margin-top:22px">'+esc(p.note)+'</p>':'')); }
function viewContact(){ var p=page('contact'); var cells=[]; if(p.email)cells.push({h:'General enquiries',b:p.email}); if(p.supportEmail)cells.push({h:'Support',b:p.supportEmail}); if(p.phone)cells.push({h:'Phone',b:p.phone}); if(p.hours)cells.push({h:'Hours',b:p.hours}); if(p.address)cells.push({h:'Address',b:p.address}); var grid=cells.map(function(c){return '<div class="block"><h3>'+esc(c.h)+'</h3><p>'+esc(c.b)+'</p></div>';}).join(''); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1><p class="pintro">'+esc(p.intro)+'</p><div class="contact-grid">'+grid+'</div>'); }
function viewFaq(){ var p=page('faq'); var items=(p.items||[]).map(function(i){return '<details class="faq"><summary>'+esc(i.q)+'</summary><p>'+esc(i.a)+'</p></details>';}).join(''); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1><p class="pintro">'+esc(p.intro)+'</p><div class="faq-list">'+items+'</div>'); }
function viewDownload(){ var h=page('home'); return pageShell('<h1 class="ph">Download Vaulmo</h1><p class="pintro">'+esc(h.ctaIntro)+'</p><div style="display:flex;justify-content:center;margin-top:24px">'+stores()+'</div>'); }

var ROUTES={ '' :viewHome, '/':viewHome, '/features':function(){return viewSimple('features');}, '/security':viewSecurity, '/privacy':function(){return viewSimple('privacy');}, '/support':viewSupport, '/about':function(){return viewSimple('about');}, '/contact':viewContact, '/faq':viewFaq, '/download':viewDownload };

function route(){
  var hash=(location.hash||'#/').replace(/^#/,'');
  var view=ROUTES[hash]||viewHome;
  document.getElementById('app').innerHTML=view();
  var links=document.querySelectorAll('#navLinks a');
  for(var i=0;i<links.length;i++){ links[i].classList.toggle('active', links[i].getAttribute('href')==='#'+hash); }
  window.scrollTo(0,0);
}

function load(){
  renderChrome(); route();
  fetch(API+'/site/pages').then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d.pages){ d.pages.forEach(function(p){ if(p&&p.slug){ CONTENT[p.slug]=p.content; } }); renderChrome(); route(); }
  }).catch(function(){ /* keep defaults */ });
}
window.addEventListener('hashchange', route);
load();
</script>
</body>
