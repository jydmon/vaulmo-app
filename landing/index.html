<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Vaulmo — Your family's document vault, locked down</title>
<meta name="description" content="Vaulmo keeps your family's most important documents secure, organised, and always to hand. Bank-level encryption, smart scanning, and renewal reminders." />
<link id="favicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%232563EB'/%3E%3Cpath d='M256 120c44 0 80 12 116 30v112c0 74-46 126-116 152-70-26-116-78-116-152V150c36-18 72-30 116-30Z' fill='%23ffffff'/%3E%3Cpath d='M196 196l60 126 60-126' fill='none' stroke='%232563EB' stroke-width='40' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='116' fill='%232563EB'/%3E%3Cpath d='M256 120c44 0 80 12 116 30v112c0 74-46 126-116 152-70-26-116-78-116-152V150c36-18 72-30 116-30Z' fill='%23ffffff'/%3E%3C/svg%3E" />
<style>
  :root{
    --navy:#0F172A; --navy2:#111c33; --blue:#2563EB; --blue-d:#1E3A8A;
    --aqua:#22D3EE; --ink:#0F172A; --muted:#5b6b85; --line:#e6ebf3; --bg:#f6f8fc; --card:#ffffff;
    --radius:18px; --shadow:0 18px 50px rgba(15,23,42,.10);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1140px;margin:0 auto;padding:0 24px}

  /* nav */
  nav{position:sticky;top:0;z-index:50;background:rgba(246,248,252,.82);backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:68px}
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.5px}
  .brand svg{display:block}
  .brand-logo{display:block;height:38px;width:auto;max-width:190px;object-fit:contain}
  #footBrand .brand-logo{height:30px}
  .nav-links{display:flex;align-items:center;gap:22px}
  .nav-links a{color:var(--muted);font-weight:600;font-size:15px}
  .nav-links a:hover{color:var(--ink)}
  .nav-links a.active{color:var(--ink)}
  .btn{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;font-weight:700;padding:11px 18px;border-radius:12px;font-size:15px;transition:transform .15s ease, box-shadow .15s;border:0;cursor:pointer}
  .btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(37,99,235,.35)}
  /* FIX: the Download button text must stay white — .nav-links a would otherwise
     out-specify .btn and turn it grey. */
  .nav-links a.btn, .nav-links a.btn:hover{color:#fff}
  @media(max-width:860px){.nav-links a:not(.btn){display:none}}

  /* hero */
  .hero{background:radial-gradient(1200px 500px at 80% -10%, #24407e 0%, transparent 60%), linear-gradient(160deg,#0F172A 0%, #16233f 60%, #1E3A8A 140%);color:#fff;overflow:hidden}
  .hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:78px 0 90px}
  .pill{display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#cfe0ff;font-weight:600;font-size:13px;padding:7px 13px;border-radius:999px;margin-bottom:22px}
  .pill .dot{width:8px;height:8px;border-radius:50%;background:var(--aqua);box-shadow:0 0 10px var(--aqua)}
  h1{font-size:clamp(34px,5vw,54px);line-height:1.05;letter-spacing:-1.5px;font-weight:850;margin-bottom:18px}
  h1 .grad{background:linear-gradient(90deg,#7cc7ff,#22D3EE);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{font-size:19px;color:#c4d1ea;max-width:520px;margin-bottom:30px}
  .stores{display:flex;gap:14px;flex-wrap:wrap}
  .store{display:inline-flex;align-items:center;gap:11px;background:#000;color:#fff;border:1px solid #2c3550;padding:11px 18px;border-radius:14px;transition:transform .15s, border-color .15s}
  .store:hover{transform:translateY(-2px);border-color:#4b5875}
  .store small{display:block;font-size:11px;opacity:.8;line-height:1.1;letter-spacing:.3px}
  .store strong{display:block;font-size:19px;line-height:1.15;font-weight:700;margin-top:1px}
  .store svg{flex:none}
  .hero-note{margin-top:16px;font-size:13px;color:#8ea3c8}

  /* phone */
  .phone-col{display:flex;justify-content:center}
  .phone{width:290px;height:590px;background:#0b1220;border-radius:44px;padding:12px;box-shadow:0 40px 80px rgba(0,0,0,.5), inset 0 0 0 2px #2a3350;position:relative}
  .phone .notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:130px;height:26px;background:#0b1220;border-radius:0 0 16px 16px;z-index:3}
  .screen{width:100%;height:100%;background:linear-gradient(180deg,#eef3fb,#ffffff);border-radius:34px;overflow:hidden;position:relative;color:var(--ink)}
  .s-top{background:linear-gradient(160deg,#2563EB,#1E3A8A);color:#fff;padding:34px 20px 22px}
  .s-top .stitle{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
  .s-hero{margin-top:16px}
  .s-hero .lab{font-size:12px;color:#cfe0ff}
  .s-hero .big{font-size:30px;font-weight:850;letter-spacing:-1px}
  .s-hero .sub{font-size:12px;color:#cfe0ff;margin-top:2px}
  .s-body{padding:16px}
  .doc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px;box-shadow:0 4px 14px rgba(15,23,42,.04)}
  .doc .ic{width:34px;height:34px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center}
  .doc .m{flex:1;min-width:0}
  .doc .t{font-size:13px;font-weight:700}
  .doc .d{font-size:11px;color:var(--muted)}
  .chip{font-size:10px;font-weight:700;padding:4px 8px;border-radius:999px}
  .s-tabs{position:absolute;bottom:0;left:0;right:0;height:58px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 6px}
  .s-tabs span{width:22px;height:22px;border-radius:6px;background:#dfe7f4}
  .s-tabs span.act{background:var(--blue)}

  /* sections */
  section{padding:82px 0}
  .eyebrow{color:var(--blue);font-weight:800;letter-spacing:.6px;text-transform:uppercase;font-size:13px;text-align:center}
  h2{font-size:clamp(28px,4vw,40px);letter-spacing:-1px;font-weight:850;text-align:center;margin:10px 0 12px}
  .sub2{color:var(--muted);text-align:center;max-width:620px;margin:0 auto 46px;font-size:17px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px 22px;box-shadow:var(--shadow)}
  .card .fic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;background:#e7efff}
  .card h3{font-size:17px;margin-bottom:7px;letter-spacing:-.3px}
  .card p{color:var(--muted);font-size:14.5px}
  @media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:520px){.grid{grid-template-columns:1fr}}

  /* security band */
  .band{background:linear-gradient(160deg,#0F172A,#1E3A8A);color:#fff;border-radius:26px;padding:56px 44px;display:grid;grid-template-columns:1.1fr .9fr;gap:34px;align-items:center}
  .band h2{text-align:left;margin-top:0}
  .band .sub2{text-align:left;margin:0 0 22px;color:#c4d1ea}
  .band ul{list-style:none;display:grid;gap:12px}
  .band li{display:flex;gap:11px;align-items:flex-start;color:#dbe6fb;font-size:15px}
  .band li svg{flex:none;margin-top:2px}
  @media(max-width:820px){.band{grid-template-columns:1fr;padding:40px 26px}.hero-in{grid-template-columns:1fr;padding:56px 0 64px}.phone-col{order:-1;margin-bottom:10px}}

  /* content sub-pages */
  .page{padding:64px 0 40px}
  .page .lede{max-width:760px;margin:0 auto}
  .page h1.ph{font-size:clamp(30px,4.4vw,44px);text-align:center;letter-spacing:-1px;margin-bottom:12px}
  .page .pintro{color:var(--muted);text-align:center;font-size:18px;max-width:680px;margin:0 auto 10px}
  .page .updated{text-align:center;color:var(--muted);font-size:13px;margin-bottom:8px}
  .blocks{max-width:820px;margin:34px auto 0;display:grid;gap:16px}
  .block{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow)}
  .block h3{font-size:18px;margin-bottom:6px;letter-spacing:-.3px}
  .block p{color:var(--muted);font-size:15.5px}
  .checklist{max-width:820px;margin:26px auto 0;display:grid;gap:12px;list-style:none}
  .checklist li{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;font-size:15.5px}
  .checklist li svg{flex:none;margin-top:3px}
  .contact-grid{max-width:820px;margin:30px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.contact-grid{grid-template-columns:1fr}}
  .faq-list{max-width:820px;margin:30px auto 0;display:grid;gap:12px}
  details.faq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 20px;box-shadow:var(--shadow)}
  details.faq summary{cursor:pointer;font-weight:700;font-size:16px;padding:16px 0;list-style:none;display:flex;justify-content:space-between;align-items:center}
  details.faq summary::-webkit-details-marker{display:none}
  details.faq summary::after{content:'+';color:var(--blue);font-weight:800;font-size:22px}
  details.faq[open] summary::after{content:'–'}
  details.faq p{color:var(--muted);font-size:15.5px;padding:0 0 18px}
  .backhome{display:inline-flex;align-items:center;gap:6px;color:var(--blue);font-weight:700;margin:8px 0 0}
  /* features with images */
  .feats{max-width:960px;margin:34px auto 0;display:grid;gap:22px}
  .feat-row{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow)}
  .feat-row.rev .feat-media{order:2}
  .feat-txt h3{font-size:21px;letter-spacing:-.4px;margin-bottom:8px}
  .feat-txt p{color:var(--muted);font-size:15.5px}
  .feat-media{display:flex}
  .illus{width:100%;aspect-ratio:16/10;border-radius:16px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .illus::before{content:"";position:absolute;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.16);top:-50px;right:-40px}
  .illus::after{content:"";position:absolute;width:120px;height:120px;border-radius:30px;background:rgba(255,255,255,.12);bottom:-30px;left:-20px;transform:rotate(18deg)}
  .illus svg{width:60%;height:auto;position:relative;filter:drop-shadow(0 8px 18px rgba(0,0,0,.22))}
  .feat-img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:16px}
  @media(max-width:720px){.feat-row{grid-template-columns:1fr}.feat-row.rev .feat-media{order:0}}
  /* header illustration on content pages */
  .page-illus{max-width:560px;margin:22px auto 6px}
  .page-illus .illus{aspect-ratio:16/9}
  .page-illus img{width:100%;display:block}
  /* device frames for real app screenshots */
  .win{border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#fff;width:100%}
  .win .winbar{height:34px;background:#f1f5f9;display:flex;align-items:center;gap:7px;padding:0 13px;border-bottom:1px solid var(--line)}
  .win .winbar i{width:11px;height:11px;border-radius:50%;background:#cbd5e1;display:inline-block}
  .win .winbar i:nth-child(1){background:#f87171}.win .winbar i:nth-child(2){background:#fbbf24}.win .winbar i:nth-child(3){background:#34d399}
  .win img{width:100%;display:block}
  .phone-frame{background:#0f172a;border-radius:30px;padding:10px;width:232px;max-width:70%;margin:0 auto;box-shadow:var(--shadow)}
  .phone-frame .scr{border-radius:22px;overflow:hidden;background:#fff;position:relative}
  .phone-frame .scr::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:74px;height:6px;border-radius:6px;background:rgba(255,255,255,.5);z-index:2}
  .phone-frame img{width:100%;display:block}
  .feat-media .win,.feat-media .phone-frame{margin:0 auto}
  /* contact form */
  .contact-form{max-width:640px;margin:28px auto 0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:26px 26px 28px;box-shadow:var(--shadow);display:grid;gap:14px}
  .contact-form .cf-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  @media(max-width:560px){.contact-form .cf-row{grid-template-columns:1fr}}
  .contact-form input,.contact-form textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:15.5px;background:#fff;color:var(--ink)}
  .contact-form textarea{min-height:130px;resize:vertical}
  .contact-form input:focus,.contact-form textarea:focus{outline:2px solid var(--blue);outline-offset:1px;border-color:var(--blue)}
  .contact-form .cf-err{color:#dc2626;font-size:14px}
  .cf-ok{max-width:640px;margin:28px auto 0;background:#e7f8ee;border:1px solid #b6e6c9;color:#0f7a43;border-radius:16px;padding:22px 24px;text-align:center;font-weight:600}

  /* subscribe form */
  .subwrap{max-width:560px;margin:24px auto 0}
  .sub-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);text-align:left}
  .sub-card.dark{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);box-shadow:none}
  .sub-card .sh{font-weight:800;font-size:18px;letter-spacing:-.3px;margin-bottom:3px}
  .sub-card.dark .sh{color:#fff}
  .sub-card .ss{color:var(--muted);font-size:14px;margin-bottom:14px}
  .sub-card.dark .ss{color:#c4d1ea}
  .sub-row{display:flex;gap:10px;flex-wrap:wrap}
  .subform input{flex:1;min-width:170px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:#fff;color:var(--ink);font-family:inherit}
  .subform .check{display:flex;align-items:center;gap:9px;margin:12px 2px;font-size:14px;color:var(--muted);cursor:pointer}
  .sub-card.dark .subform .check{color:#cfe0ff}
  .subform button{margin-top:6px;width:100%;justify-content:center;border:0;cursor:pointer}
  .sub-ok{color:#0f9d58;font-weight:700;text-align:center;padding:10px}
  .sub-card.dark .sub-ok{color:#7ef0b0}
  .sub-err{color:#d03b3b;font-weight:600;font-size:13.5px;margin-top:8px}

  /* socials */
  .socials{display:flex;gap:12px}
  .socials a{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);transition:.15s}
  .socials a:hover{color:#fff;background:var(--blue);border-color:var(--blue)}

  /* pricing */
  .plan-cards{max-width:1000px;margin:34px auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;align-items:stretch}
  .plan-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;position:relative}
  .plan-card.pop{border-color:var(--blue);box-shadow:0 0 0 3px var(--brand-soft),var(--shadow)}
  .pl-name{font-weight:800;font-size:18px;letter-spacing:-.3px}
  .pl-badge{display:inline-block;background:var(--brand-soft);color:var(--blue);font-weight:700;font-size:12px;padding:3px 10px;border-radius:999px;margin-top:8px;width:fit-content}
  .pl-price{font-size:34px;font-weight:850;letter-spacing:-1px;margin:12px 0 4px;line-height:1}
  .pl-price .per{font-size:14px;font-weight:600;color:var(--muted);letter-spacing:0}
  .pl-price .was{font-size:17px;color:var(--muted);text-decoration:line-through;font-weight:600;margin-right:8px}
  .pl-feats{list-style:none;display:grid;gap:9px;margin:16px 0 20px;flex:1}
  .pl-feats li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px;color:var(--ink)}
  .pl-feats li svg{flex:none;margin-top:3px}
  .plan-card .btn{margin-top:auto;width:100%;justify-content:center}

  /* launch popup */
  .modal-back{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .modal-back.open{display:flex}
  .modal{background:#fff;border-radius:20px;max-width:470px;width:100%;padding:30px 28px;box-shadow:0 30px 80px rgba(0,0,0,.4);position:relative}
  .modal h3{font-size:23px;letter-spacing:-.5px;margin-bottom:8px}
  .modal p{color:var(--muted);margin-bottom:18px}
  .modal .x{position:absolute;top:12px;right:16px;font-size:24px;color:var(--muted);cursor:pointer;background:none;border:0;line-height:1}

  /* cta + footer */
  .cta{text-align:center}
  .cta .stores{justify-content:center}
  footer{border-top:1px solid var(--line);padding:34px 0;color:var(--muted);font-size:14px}
  .foot-in{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .foot-links{display:flex;gap:20px;flex-wrap:wrap}
  .foot-links a:hover{color:var(--ink)}
  /* website help chat widget */
  .chat-fab{position:fixed;right:20px;bottom:20px;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff;font-size:24px;box-shadow:0 10px 30px rgba(37,99,235,.4);cursor:pointer;z-index:60}
  .chat-panel{position:fixed;right:20px;bottom:20px;width:344px;max-width:calc(100vw - 32px);height:486px;max-height:calc(100vh - 40px);background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 60px rgba(15,23,42,.28);display:flex;flex-direction:column;overflow:hidden;z-index:61}
  .chat-panel[hidden],.chat-handoff[hidden]{display:none}
  .chat-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#3B82F6,#1E3A8A);color:#fff}
  .chat-head span{display:block;font-size:12px;opacity:.85}
  .chat-head button{background:transparent;border:0;color:#fff;font-size:22px;cursor:pointer;line-height:1}
  .chat-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#f6f8fc}
  .cb{max-width:82%;padding:9px 12px;border-radius:12px;font-size:14px;line-height:1.45;white-space:pre-wrap}
  .cb.me{align-self:flex-end;background:#2563EB;color:#fff;border-bottom-right-radius:4px}
  .cb.them{align-self:flex-start;background:#fff;border:1px solid var(--line);color:#0f172a;border-bottom-left-radius:4px}
  .chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
  .chat-input input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
  .chat-input .btn{padding:10px 14px}
  .chat-human{border:0;background:#eef2f8;color:#2563EB;font-weight:700;font-size:12.5px;padding:9px;cursor:pointer;border-top:1px solid var(--line)}
  .chat-handoff{padding:12px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
  .chat-handoff input,.chat-handoff textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:14px}
  .chat-handoff textarea{min-height:72px;resize:vertical}
  .chat-link{background:transparent;border:0;color:var(--muted);font-size:12.5px;cursor:pointer}
  .chat-err{color:#dc2626;font-size:12.5px}
  .chat-ok{background:#e7f8ee;border:1px solid #b6e6c9;color:#0f7a43;border-radius:12px;padding:14px;text-align:center;font-weight:600;font-size:13.5px}
  @media(max-width:480px){.chat-panel{right:8px;bottom:8px;width:calc(100vw - 16px);height:72vh}}
</style>
</head>
<body>

<nav>
  <div class="wrap nav-in">
    <a class="brand" id="navBrand" href="#/" aria-label="Vaulmo home">

/* ---- waitlist submit + launch popup ---- */
function submitSub(form){
  var err=form.querySelector('.sub-err'); err.hidden=true;
  var name=(form.name.value||'').trim(), email=(form.email.value||'').trim(), notify=form.notify.checked;
  if(!name||!email){ err.textContent='Please enter your name and email.'; err.hidden=false; return; }
  var btn=form.querySelector('button'); btn.disabled=true; btn.textContent='Joining…';
  fetch(API+'/site/subscribe',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name,email:email,notifyAtLaunch:notify,source:'website'})})
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(){ var card=form.closest('.sub-card'); var s=(page('global').subscribe)||{}; card.innerHTML='<div class="sub-ok">✓ '+esc(s.success||'You’re on the list — thank you!')+'</div>'; })
    .catch(function(){ btn.disabled=false; btn.textContent=(page('global').subscribe||{}).button||'Join the waitlist'; err.textContent='Something went wrong — please try again.'; err.hidden=false; });
}
function openPopup(){ document.getElementById('popup').classList.add('open'); }
function closePopup(){ document.getElementById('popup').classList.remove('open'); }

document.addEventListener('submit', function(e){ var f=e.target; if(f&&f.matches){ if(f.matches('form[data-sub]')){ e.preventDefault(); submitSub(f); } else if(f.matches('form[data-contact]')){ e.preventDefault(); submitContact(f); } } });
document.addEventListener('click', function(e){
  var dl=e.target.closest && e.target.closest('[data-download]');

  if(e.target.id==='popupClose' || e.target.id==='popup'){ closePopup(); }
});

function illus(key){ var t=ILLUS[key]||ILLUS.scan; return '<div class="illus" style="background:linear-gradient(140deg,'+t[0]+','+t[1]+')"><svg viewBox="0 0 200 130" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true">'+t[2]+'</svg></div>'; }
/* A header illustration for a content page (contact/about/plans). */
/* Wrap a real screenshot in a device frame — a phone frame for mobile shots
   (filename contains "m-" or "phone"), otherwise a browser-window frame. */
function isShot(src){ return /^(https?:|\/)/.test(src||'') && /\.(png|jpe?g|webp)$/i.test(src||''); }
function deviceShot(src){
  if(/(^|\/)m-|phone/.test(src)) return '<div class="phone-frame"><div class="scr"><img src="'+esc(src)+'" alt="Vaulmo app screen" loading="lazy"></div></div>';
  return '<div class="win"><div class="winbar"><i></i><i></i><i></i></div><img src="'+esc(src)+'" alt="Vaulmo app screen" loading="lazy"></div>';
}
function pageIllus(key){ if(!key) return ''; if(isShot(key)) return '<div class="page-illus">'+deviceShot(key)+'</div>'; if(/^(https?:|\/)/.test(key)) return '<div class="page-illus"><img src="'+esc(key)+'" alt=""></div>'; return '<div class="page-illus">'+illus(key)+'</div>'; }
function viewFeatures(){
  var p=page('features');
  var rows=(p.sections||[]).map(function(s,i){
    var media = isShot(s.image) ? deviceShot(s.image) : (/^(https?:|\/)/.test(s.image||'') ? '<img class="feat-img" src="'+esc(s.image)+'" alt="'+esc(s.heading)+'">' : illus(s.image));
    return '<div class="feat-row'+(i%2?' rev':'')+'"><div class="feat-media">'+media+'</div><div class="feat-txt"><h3>'+esc(s.heading)+'</h3><p>'+esc(s.body)+'</p></div></div>';
  }).join('');
  return pageShell('<h1 class="ph">'+esc(p.title)+'</h1><p class="pintro">'+esc(p.intro)+'</p>'+pageIllus(p.image)+'<div class="feats">'+rows+'</div>');
}
function pageShell(inner){ return '<section class="page"><div class="wrap">'+inner+'<div style="text-align:center"><a class="backhome" href="#/">← Back to home</a></div></div></section>'; }

function viewSimple(slug){ var p=page(slug); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1>'+(p.updated?'<div class="updated">'+esc(p.updated)+'</div>':'')+'<p class="pintro">'+esc(p.intro)+'</p>'+blocks(p.sections)); }
function viewSecurity(){ var p=page('security'); var pts=(p.points||[]).map(function(x){return '<li>'+CHECKB+' '+esc(x)+'</li>';}).join(''); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1><p class="pintro">'+esc(p.intro)+'</p><ul class="checklist">'+pts+'</ul>'+blocks(p.sections)); }
function viewSupport(){ var p=page('support'); var ch=(p.channels||[]).map(function(c){return '<div class="block"><h3>'+esc(c.name)+'</h3><p>'+esc(c.detail)+'</p></div>';}).join(''); var secs=(p.sections&&p.sections.length)?blocks(p.sections):''; return pageShell('<h1 class="ph">'+esc(p.title)+'</h1><p class="pintro">'+esc(p.intro)+'</p><div class="blocks">'+ch+'</div>'+secs+(p.note?'<p class="pintro" style="margin-top:22px">'+esc(p.note)+'</p>':'')); }
function contactForm(){
  var p=page('contact');
  return '<form class="contact-form" data-contact novalidate>'
    + '<div class="cf-row"><input type="text" name="name" required placeholder="'+esc(p.namePlaceholder||'Your name')+'" autocomplete="name"><input type="email" name="email" required placeholder="'+esc(p.emailPlaceholder||'you@example.com')+'" autocomplete="email"></div>'
    + '<input type="text" name="subject" placeholder="'+esc(p.subjectPlaceholder||'Subject (optional)')+'">'
    + '<textarea name="message" required placeholder="'+esc(p.messagePlaceholder||'How can we help?')+'"></textarea>'
    + '<div class="cf-err" hidden></div>'
    + '<button class="btn" type="submit">'+esc(p.button||'Send message')+'</button>'
    + '</form>';
}
function viewContact(){ var p=page('contact'); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1>'+pageIllus(p.image)+'<p class="pintro">'+esc(p.intro)+'</p>'+contactForm()); }
function viewAbout(){ var p=page('about'); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1>'+pageIllus(p.image)+'<p class="pintro">'+esc(p.intro)+'</p>'+blocks(p.sections)); }
function submitContact(form){
  var err=form.querySelector('.cf-err'); err.hidden=true;
  var name=(form.name.value||'').trim(), email=(form.email.value||'').trim(), subject=(form.subject.value||'').trim(), message=(form.message.value||'').trim();
  if(!name||!email||!message){ err.textContent='Please add your name, email and a message.'; err.hidden=false; return; }
  var btn=form.querySelector('button'); btn.disabled=true; btn.textContent='Sending…';
  fetch(API+'/site/contact',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name,email:email,subject:subject,message:message,source:'website'})})
    .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
    .then(function(){ var p=page('contact'); form.outerHTML='<div class="cf-ok">✓ '+esc(p.success||'Thanks — your message has been sent.')+'</div>'; })
    .catch(function(){ btn.disabled=false; btn.textContent=(page('contact').button)||'Send message'; err.textContent='Something went wrong — please try again.'; err.hidden=false; });
}
function viewFaq(){ var p=page('faq'); var items=(p.items||[]).map(function(i){return '<details class="faq"><summary>'+esc(i.q)+'</summary><p>'+esc(i.a)+'</p></details>';}).join(''); return pageShell('<h1 class="ph">'+esc(p.title)+'</h1><p class="pintro">'+esc(p.intro)+'</p><div class="faq-list">'+items+'</div>'); }
function viewDownload(){ var h=page('home'); return pageShell('<h1 class="ph">Download Vaulmo</h1><p class="pintro">'+esc(h.ctaIntro)+'</p><div style="display:flex;justify-content:center;margin-top:24px">'+stores()+'</div>'); }

/* Pricing page — the plan cards come LIVE from the admin-managed plans (only active
   plans show), while the surrounding copy is CMS-editable via the "plans" page. */
function money(amount,currency){ var sym=currency==='usd'?'$':currency==='eur'?'€':'£'; var whole=(amount%100)===0; return sym+(amount/100).toFixed(whole?0:2); }
function fetchPlans(){
  var host=document.getElementById('planCards'); if(!host) return;
  var pc=page('plans'), g=page('global');
  fetch(API+'/site/plans').then(function(r){return r.ok?r.json():null;}).then(function(d){
    var plans=(d&&d.plans)||[];
    if(!plans.length){ host.innerHTML='<div class="empty">'+esc(pc.emptyText||'Plans coming soon.')+'</div>'; return; }
    var mid=Math.floor(plans.length/2);
    host.innerHTML=plans.map(function(pl,idx){
      var free=(pl.netAmount||0)===0;
      var per=pl.interval==='month'?(pc.perMonth||'/month'):(pc.perYear||'/year');
      var priceInner=free?esc(pc.freeText||'Free'):(((pl.discountPercent>0)?'<span class="was">'+money(pl.amount,pl.currency)+'</span>':'')+money(pl.netAmount,pl.currency)+'<span class="per">'+esc(per)+'</span>');
      var badge=pl.discountLabel?'<span class="pl-badge">'+esc(pl.discountLabel)+'</span>':'';
      var feats=(pl.features||[]).map(function(f){return '<li>'+CHECKB+' '+esc(f)+'</li>';}).join('');
      var pop=(plans.length>2 && idx===mid)?' pop':'';
      return '<div class="plan-card'+pop+'"><div class="pl-name">'+esc(pl.name)+'</div>'+badge+'<div class="pl-price">'+priceInner+'</div><ul class="pl-feats">'+feats+'</ul><a class="btn" data-download href="'+esc(g.appUrl||'#')+'">'+esc(pc.ctaLabel||'Get started')+'</a></div>';
    }).join('');
  }).catch(function(){ host.innerHTML='<div class="empty">'+esc(pc.emptyText||'Plans coming soon.')+'</div>'; });
}
function viewPlans(){
  var p=page('plans');
  setTimeout(fetchPlans,0);
  return pageShell('<h1 class="ph">'+esc(p.title)+'</h1>'+pageIllus(p.image)+'<p class="pintro">'+esc(p.intro)+'</p><div id="planCards" class="plan-cards"><div class="empty">Loading plans…</div></div>'+(p.note?'<p class="pintro" style="margin-top:24px;font-size:14px">'+esc(p.note)+'</p>':''));
}

var ROUTES={ '' :viewHome, '/':viewHome, '/features':viewFeatures, '/plans':viewPlans, '/security':viewSecurity, '/privacy':function(){return viewSimple('privacy');}, '/support':viewSupport, '/about':viewAbout, '/contact':viewContact, '/faq':viewFaq, '/terms':function(){return viewSimple('terms');}, '/download':viewDownload };

function route(){
  var hash=(location.hash||'#/').replace(/^#/,'');
  var view=ROUTES[hash]||viewHome;
  document.getElementById('app').innerHTML=view();
  var links=document.querySelectorAll('#navLinks a');
  for(var i=0;i<links.length;i++){ links[i].classList.toggle('active', links[i].getAttribute('href')==='#'+hash); }
  window.scrollTo(0,0);
}

function load(){
  renderChrome(); route();
  fetch(API+'/site/pages').then(function(r){return r.ok?r.json():null;}).then(function(d){
    if(d&&d.pages){ d.pages.forEach(function(p){ if(p&&p.slug){ CONTENT[p.slug]=p.content; } }); renderChrome(); route(); }
  }).catch(function(){ /* keep defaults */ });
}
window.addEventListener('hashchange', route);
/* ---- website help chat: bot answers from site content, with staff hand-off ---- */
(function(){
  var transcript=[];
  function el(id){return document.getElementById(id);}
  function scrollLog(){var l=el('chatLog'); l.scrollTop=l.scrollHeight;}
  function bubble(role,text){ var d=document.createElement('div'); d.className='cb '+(role==='user'?'me':'them'); d.textContent=text; el('chatLog').appendChild(d); scrollLog(); transcript.push((role==='user'?'Visitor: ':'Vaulmo: ')+text); }
  function greet(){ if(!el('chatLog').childElementCount){ bubble('bot','Hi! I’m the Vaulmo assistant. Ask me about security, plans or features — or tap “Talk to a human” to reach our team.'); } }
  function openChat(){ el('chatPanel').hidden=false; el('chatFab').style.display='none'; greet(); el('chatInput').focus(); }
  function closeChat(){ el('chatPanel').hidden=true; el('chatFab').style.display=''; el('chatHandoff').hidden=true; el('chatForm').style.display=''; }
  el('chatFab').addEventListener('click',openChat);
  el('chatClose').addEventListener('click',closeChat);
  el('chatForm').addEventListener('submit',function(e){ e.preventDefault(); var q=el('chatInput').value.trim(); if(!q)return; el('chatInput').value=''; bubble('user',q);
    var typing=document.createElement('div'); typing.className='cb them'; typing.textContent='…'; el('chatLog').appendChild(typing); scrollLog();
    fetch(API+'/site/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:q})})
      .then(function(r){return r.json();}).then(function(d){ typing.remove(); bubble('bot',d.answer||'Sorry, I didn’t catch that.'); })
      .catch(function(){ typing.remove(); bubble('bot','I’m having trouble reaching the server — tap “Talk to a human” and we’ll email you back.'); });
  });
  el('chatHuman').addEventListener('click',function(){ el('chatHandoff').hidden=false; el('chatForm').style.display='none'; el('chatName').focus(); });
  el('chatBack').addEventListener('click',function(){ el('chatHandoff').hidden=true; el('chatForm').style.display=''; });
  el('chatSend2').addEventListener('click',function(){
    var err=el('chatErr'); err.hidden=true;
    var name=el('chatName').value.trim(), email=el('chatEmail').value.trim(), msg=el('chatMsg').value.trim();
    if(!name||!email||!msg){ err.textContent='Please add your name, email and a message.'; err.hidden=false; return; }
    var btn=el('chatSend2'); btn.disabled=true; btn.textContent='Sending…';
    fetch(API+'/site/chat/handoff',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:name,email:email,message:msg,transcript:transcript.join('\n')})})
      .then(function(r){ if(!r.ok) throw new Error(); return r.json(); })
      .then(function(){ el('chatHandoff').innerHTML='<div class="chat-ok">✓ Thanks — your message is with our team. We’ll email you at '+esc(email)+'.</div>'; })
      .catch(function(){ btn.disabled=false; btn.textContent='Send to our team'; err.textContent='Something went wrong — please try again.'; err.hidden=false; });
  });
})();
load();
</script>
